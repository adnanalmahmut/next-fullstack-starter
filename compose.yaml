name: ${COMPOSE_PROJECT_NAME:-next-fullstack-starter}

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.4-alpine}
    container_name: ${POSTGRES_CONTAINER_NAME:-next-fullstack-starter-postgres}
    restart: unless-stopped
    init: true

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}

    secrets:
      - postgres_password

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    networks:
      - database_network

    cpus: "${POSTGRES_CPUS:-1.00}"
    mem_limit: ${POSTGRES_MEM_LIMIT:-512m}
    mem_reservation: ${POSTGRES_MEM_RESERVATION:-256m}
    pids_limit: ${POSTGRES_PIDS_LIMIT:-200}
    shm_size: ${POSTGRES_SHM_SIZE:-128m}

    stop_grace_period: 30s

    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "${POSTGRES_LOG_MAX_SIZE:-10m}"
        max-file: "${POSTGRES_LOG_MAX_FILE:-3}"

  postgres-test:
    profiles:
      - test

    image: ${POSTGRES_IMAGE:-postgres:18.4-alpine}
    container_name: ${POSTGRES_TEST_CONTAINER_NAME:-next-fullstack-starter-postgres-test}
    restart: "no"
    init: true

    environment:
      POSTGRES_USER: ${POSTGRES_TEST_USER:?POSTGRES_TEST_USER is required}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_test_password
      POSTGRES_DB: ${POSTGRES_TEST_DB:?POSTGRES_TEST_DB is required}

    secrets:
      - postgres_test_password

    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-5433}:5432"

    tmpfs:
      - /var/lib/postgresql

    networks:
      - database_network

    cpus: "${POSTGRES_TEST_CPUS:-0.50}"
    mem_limit: ${POSTGRES_TEST_MEM_LIMIT:-384m}
    mem_reservation: ${POSTGRES_TEST_MEM_RESERVATION:-128m}
    pids_limit: ${POSTGRES_TEST_PIDS_LIMIT:-150}
    shm_size: ${POSTGRES_TEST_SHM_SIZE:-128m}

    stop_grace_period: 15s

    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "${POSTGRES_TEST_LOG_MAX_SIZE:-5m}"
        max-file: "${POSTGRES_TEST_LOG_MAX_FILE:-2}"

volumes:
  postgres_data:
    driver: local

networks:
  database_network:
    driver: bridge

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:?POSTGRES_PASSWORD_FILE is required}

  postgres_test_password:
    file: ${POSTGRES_TEST_PASSWORD_FILE:?POSTGRES_TEST_PASSWORD_FILE is required}
