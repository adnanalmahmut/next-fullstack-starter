name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: next_fullstack_starter
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d next_fullstack_starter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

      # Redis is optional for the application. It is provisioned here so the
      # Redis integration suite has a server, and deliberately not wired into
      # the application: the `Verify project` and end-to-end steps below run
      # with Redis disabled, which is what proves that caching, rate limiting,
      # idempotency, and locks are all opt-in rather than requirements.
      redis:
        image: redis:8.2.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 5s

    env:
      APP_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/next_fullstack_starter?schema=public
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      # Test-only value for an ephemeral CI database. Never used for a deployed
      # environment, and the application has no runtime fallback.
      BETTER_AUTH_SECRET: test-only-better-auth-secret-do-not-use-in-production
      # The whole job runs with Redis off. Only the Redis integration step below
      # overrides this, so a regression that made the application depend on
      # Redis would fail `Verify project` rather than pass unnoticed.
      REDIS_ENABLED: "false"
      # The same for background jobs, and for the same reason. No worker process
      # is ever started here, and `JOBS_REDIS_URL` is deliberately absent from
      # this block: `Verify project` and the end-to-end run must pass on a
      # machine that has no queue and no address for one.
      JOBS_ENABLED: "false"
      # And the same for object storage. The endpoint, the bucket, and the
      # credentials are deliberately absent from this block as well, so a
      # regression that made the application require a bucket would fail
      # `Verify project` rather than pass unnoticed on a runner that happens to
      # have one.
      STORAGE_ENABLED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Integration tests run inside `pnpm verify`, so the schema must exist
      # before it. `migrate deploy` never resets or pushes.
      - name: Apply Prisma migrations
        run: pnpm db:migrate:deploy

      - name: Verify project
        run: pnpm verify

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser and system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm test:e2e

      # The only step that sees a Redis server. It covers the foundation and the
      # cache and concurrency controls built on it; the application itself is
      # never started with Redis enabled in CI.
      - name: Run Redis integration tests
        env:
          REDIS_ENABLED: "true"
          REDIS_URL: redis://127.0.0.1:6379
          # Distinct per run and per attempt, so two CI runs against one server
          # cannot read or delete each other's keys.
          REDIS_TEST_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: pnpm test:redis:integration

      # Background jobs, enabled for this step alone. The suite starts and stops
      # its own workers; no long-lived worker process runs in CI, because a
      # worker left running would consume the jobs the tests are asserting on.
      #
      # It needs PostgreSQL as well as Redis: the outbox is a table, and the
      # guarantees under test — a change and its intent committing together, an
      # effect and its receipt committing together — are transactional.
      - name: Run jobs integration tests
        env:
          JOBS_ENABLED: "true"
          JOBS_REDIS_URL: redis://127.0.0.1:6379
          # Distinct per run and per attempt, so two CI runs against one server
          # cannot consume each other's jobs.
          JOBS_TEST_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: pnpm test:jobs:integration

      # Object storage is optional for the application, and provisioned here on
      # the same terms as Redis: the storage integration suite needs a real
      # S3-compatible server, and every other step runs with storage disabled.
      # MinIO speaks the S3 protocol, so it exercises the same adapter, the same
      # presigned POST policy, and the same conditional copy that AWS S3 and
      # Cloudflare R2 do.
      #
      # It is a step rather than a `services:` entry because MinIO needs a
      # command — `server /data` — and a service container has no way to supply
      # one. Started without it the image prints its usage and exits, so the
      # service would never become healthy.
      #
      # The image is pinned to a release rather than tracking `latest`: an
      # object store that silently changed version between two runs would make
      # an integration failure impossible to attribute.
      - name: Start MinIO
        env:
          # Test-only credentials for an ephemeral CI container. They authorize
          # nothing outside this job, and no deployed environment uses them.
          MINIO_ROOT_USER: storagetestuser
          MINIO_ROOT_PASSWORD: storagetestpassword
        run: |
          docker run --detach --name minio \
            --publish 127.0.0.1:9000:9000 \
            --env "MINIO_ROOT_USER=$MINIO_ROOT_USER" \
            --env "MINIO_ROOT_PASSWORD=$MINIO_ROOT_PASSWORD" \
            --health-cmd "mc ready local" \
            --health-interval 3s \
            --health-timeout 5s \
            --health-retries 20 \
            --health-start-period 5s \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data

          # A real readiness gate, not a sleep: the job waits for the container's
          # own health check to pass, and fails loudly if it never does.
          for attempt in $(seq 1 40); do
            status="$(docker inspect --format '{{.State.Health.Status}}' minio)"

            if [ "$status" = "healthy" ]; then
              echo "MinIO is ready."
              exit 0
            fi

            if [ "$status" = "unhealthy" ]; then
              docker logs minio
              echo "MinIO reported unhealthy." >&2
              exit 1
            fi

            sleep 3
          done

          docker logs minio
          echo "MinIO did not become ready in time." >&2
          exit 1

      # The only step that sees an object store, and the only one with storage
      # enabled. The suite creates its bucket, works under a key prefix unique
      # to this run and attempt, and removes what it wrote — so two CI runs
      # against one server cannot see or delete each other's objects.
      - name: Run storage integration tests
        env:
          STORAGE_ENABLED: "true"
          STORAGE_ENDPOINT: http://127.0.0.1:9000
          STORAGE_REGION: us-east-1
          STORAGE_BUCKET: next-fullstack-starter-ci
          # CI-local values matching the ephemeral MinIO service above.
          STORAGE_ACCESS_KEY_ID: storagetestuser
          STORAGE_SECRET_ACCESS_KEY: storagetestpassword
          # MinIO addresses a bucket in the path rather than the hostname.
          STORAGE_FORCE_PATH_STYLE: "true"
          STORAGE_TEST_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: pnpm test:storage:integration

      - name: Stop MinIO
        if: ${{ always() }}
        run: docker rm --force minio || true

      - name: Upload Playwright failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
